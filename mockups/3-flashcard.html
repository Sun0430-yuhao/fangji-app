<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="shared.css">
<style>
  .nav { height: 44px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; padding: 0 4px; }
  .nav .back { font-size: 20px; }
  .nav .t { font-size: 15px; letter-spacing: 2px; }
  .nav .r { font-size: 12px; color: var(--ink-light); }

  .prog { margin-top: 6px; }
  .prog .txt { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-light); margin-bottom: 8px; }
  .prog .txt b { color: var(--cinnabar); }
  .prog .bar { height: 4px; background: var(--card-dark); border-radius: 2px; overflow: hidden; }
  .prog .bar i { display: block; height: 100%; width: 19%; background: var(--cinnabar); border-radius: 2px; }

  .cardzone { flex: 1; display: flex; align-items: center; justify-content: center; }
  .fcard {
    width: 100%; height: 400px; border-radius: 18px;
    background: linear-gradient(160deg, #fbf7ec 0%, #f2e9d3 100%);
    border: 1.5px solid var(--cinnabar);
    box-shadow: 0 10px 30px rgba(90,70,40,0.15), inset 0 0 60px rgba(176,58,46,0.03);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; padding: 30px;
  }
  .fcard::before {
    content: ""; position: absolute; inset: 10px; border: 1px solid rgba(176,58,46,0.25); border-radius: 12px; pointer-events: none;
  }
  .fcard .q-tag { position: absolute; top: 22px; }
  .fcard .verse { font-size: 20px; line-height: 2.4; letter-spacing: 3px; text-align: center; }
  .fcard .verse u { text-decoration: none; border-bottom: 2px dashed var(--cinnabar); color: var(--cinnabar); padding: 0 6px; }
  .fcard .hint { position: absolute; bottom: 24px; font-size: 12px; color: var(--ink-light); letter-spacing: 1px; }

  .judge { display: flex; justify-content: space-around; margin: 22px 0 20px; }
  .judge .j { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .judge .c {
    width: 62px; height: 62px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 15px; letter-spacing: 1px; background: var(--card);
    box-shadow: 0 3px 8px rgba(90,70,40,0.12);
  }
  .judge .yes .c { border: 2px solid var(--bamboo); color: var(--bamboo); }
  .judge .mid .c { border: 2px solid var(--amber); color: var(--amber); }
  .judge .no  .c { border: 2px solid var(--cinnabar); color: var(--cinnabar); }
  .judge .lbl { font-size: 11px; color: var(--ink-light); }
</style>
</head>
<body>
  <div class="statusbar"><span>9:15</span><span class="icons">
    <svg width="16" height="12" viewBox="0 0 16 12"><rect x="0" y="7" width="3" height="5" fill="#2b2620"/><rect x="4.5" y="4.5" width="3" height="7.5" fill="#2b2620"/><rect x="9" y="2" width="3" height="10" fill="#2b2620"/><rect x="13" y="0" width="3" height="12" fill="#c9bfa8"/></svg>
    <svg width="22" height="11" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3" fill="none" stroke="#2b2620"/><rect x="2.5" y="2.5" width="14" height="7" rx="1.5" fill="#2b2620"/><rect x="22.5" y="4" width="2" height="4" rx="1" fill="#2b2620"/></svg>
  </span></div>

  <div class="content">
    <div class="nav"><span class="back">‹</span><span class="t">卡片背诵</span><span class="r">解表剂</span></div>

    <div class="prog">
      <div class="txt"><span>今日任务</span><span><b>3</b> / 16</span></div>
      <div class="bar"><i></i></div>
    </div>

    <div class="cardzone">
      <div class="fcard">
        <span class="seal q-tag">歌诀填空</span>
        <div class="verse">麻黄汤中臣桂枝，<br><u>　　</u>四般施。</div>
        <div class="hint">点击卡片翻面查看答案</div>
      </div>
    </div>

    <div class="judge">
      <div class="j yes"><div class="c">认识</div><span class="lbl">3 天后复习</span></div>
      <div class="j mid"><div class="c">模糊</div><span class="lbl">明天复习</span></div>
      <div class="j no"><div class="c">不认识</div><span class="lbl">10 分钟后</span></div>
    </div>
  </div>
</body>
</html>
